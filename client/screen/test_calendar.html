<!doctype html>
<html lang="ko">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Weave 일정 관리 테스트</title>

        <style>
            body {
                font-family: Arial, sans-serif;
                max-width: 900px;
                margin: 30px auto;
                padding: 0 20px;
                line-height: 1.6;
            }

            h1 {
                border-bottom: 2px solid #333;
                padding-bottom: 10px;
            }

            section {
                border: 1px solid #ddd;
                border-radius: 8px;
                padding: 20px;
                margin-bottom: 20px;
            }

            label {
                display: block;
                margin-top: 10px;
                font-weight: bold;
            }

            input,
            textarea,
            button {
                box-sizing: border-box;
                width: 100%;
                margin-top: 5px;
                padding: 10px;
                font-size: 14px;
            }

            textarea {
                resize: vertical;
            }

            button {
                cursor: pointer;
                border: none;
                border-radius: 5px;
                background-color: #333;
                color: white;
                margin-top: 12px;
            }

            button:hover {
                background-color: #555;
            }

            pre {
                background-color: #f5f5f5;
                padding: 15px;
                border-radius: 5px;
                white-space: pre-wrap;
                overflow-wrap: anywhere;
                min-height: 80px;
            }

            .description {
                color: #666;
                font-size: 13px;
            }
        </style>
    </head>

    <body>
        <h1>Weave 일정 관리 테스트</h1>

        <p class="description">
            Firebase 로그인이 완료된 상태에서 테스트해 주세요. 각 테스트의
            결과는 아래 결과 창에 표시됩니다.
        </p>

        <!-- 1. 일정 생성 -->
        <section>
            <h2>1. 일정 생성</h2>

            <label for="createTitle">일정 제목</label>
            <input
                type="text"
                id="createTitle"
                placeholder="예: 프로젝트 회의"
            />

            <label for="createStartAt">시작 일시</label>
            <input type="datetime-local" id="createStartAt" />

            <label for="createEndAt">종료 일시</label>
            <input type="datetime-local" id="createEndAt" />

            <label for="createMemo">메모</label>
            <textarea
                id="createMemo"
                rows="3"
                placeholder="일정에 대한 메모"
            ></textarea>

            <label for="createGroupId">그룹 ID (선택)</label>
            <input
                type="text"
                id="createGroupId"
                placeholder="그룹 일정이 아니라면 비워 두세요."
            />

            <label>
                <input
                    type="checkbox"
                    id="createIsPublic"
                    style="width: auto"
                />
                공개 일정
            </label>

            <button id="createBtn">일정 생성</button>
        </section>

        <!-- 2. 내 일정 조회 -->
        <section>
            <h2>2. 내 일정 조회</h2>

            <button id="getUserEventsBtn">내 일정 조회</button>
        </section>

        <!-- 3. 그룹 일정 조회 -->
        <section>
            <h2>3. 그룹 일정 조회</h2>

            <label for="searchGroupId">그룹 ID</label>
            <input
                type="text"
                id="searchGroupId"
                placeholder="조회할 그룹 ID"
            />

            <button id="getGroupEventsBtn">그룹 일정 조회</button>
        </section>

        <!-- 4. 일정 제목 검색 -->
        <section>
            <h2>4. 일정 제목 검색</h2>

            <label for="findTitle">검색할 제목</label>
            <input type="text" id="findTitle" placeholder="검색어 입력" />

            <button id="findBtn">일정 검색</button>
        </section>

        <!-- 5. 일정 수정 -->
        <section>
            <h2>5. 일정 수정</h2>

            <label for="updateEventId">수정할 일정 ID</label>
            <input
                type="text"
                id="updateEventId"
                placeholder="Firestore 문서 ID"
            />

            <label for="updateTitle">새 제목</label>
            <input type="text" id="updateTitle" placeholder="변경할 제목" />

            <label for="updateMemo">새 메모</label>
            <textarea
                id="updateMemo"
                rows="3"
                placeholder="변경할 메모"
            ></textarea>

            <button id="updateBtn">일정 수정</button>
        </section>

        <!-- 6. 일정 삭제 -->
        <section>
            <h2>6. 일정 삭제</h2>

            <label for="deleteEventId">삭제할 일정 ID</label>
            <input
                type="text"
                id="deleteEventId"
                placeholder="Firestore 문서 ID"
            />

            <button id="deleteBtn">일정 삭제</button>
        </section>

        <!-- 7. ICS 파일 -->
        <section>
            <h2>7. ICS 파일 가져오기</h2>

            <label for="icsFile">ICS 파일 선택</label>
            <input type="file" id="icsFile" accept=".ics" />

            <p class="description">
                현재 calendar.js에 ICS 가져오기 함수가 구현되어 있지 않습니다.
                파일 선택만 가능하며 실제 가져오기는 아직 실행되지 않습니다.
            </p>

            <button id="icsBtn">ICS 가져오기 기능 확인</button>
        </section>

        <!-- 결과 -->
        <section>
            <h2>테스트 결과</h2>
            <pre id="result">테스트 결과가 여기에 표시됩니다.</pre>
            <button id="clearBtn">결과 지우기</button>
        </section>

        <script type="module">
            import {
                createEvent,
                getUserEvents,
                getGroupEvents,
                updateEvent,
                findEventByTitle,
                deleteEvent,
            } from "../src/services/calendar.js";

            const $ = (id) => document.getElementById(id);
            const result = $("result");

            // 결과를 화면에 출력
            function showResult(title, data) {
                result.textContent =
                    `[${title}]\n` + JSON.stringify(data, null, 2);
            }

            // 서비스 함수의 반환값을 확인
            // 서비스 함수는 { success, data } 또는 { success, error }를 반환
            async function runTest(title, callback) {
                try {
                    const response = await callback();

                    showResult(title, response);

                    if (response && response.success === false) {
                        console.error(title, response.error);
                    }

                    return response;
                } catch (error) {
                    const errorInfo = {
                        success: false,
                        error: {
                            message: error.message,
                            code: error.code ?? null,
                        },
                    };

                    showResult(title, errorInfo);
                    console.error(title, error);

                    return errorInfo;
                }
            }

            // 1. 일정 생성
            $("createBtn").addEventListener("click", async () => {
                const title = $("createTitle").value.trim();
                const startValue = $("createStartAt").value;
                const endValue = $("createEndAt").value;
                const memo = $("createMemo").value.trim();
                const groupId = $("createGroupId").value.trim();
                const isPublic = $("createIsPublic").checked;

                if (!title || !startValue || !endValue) {
                    showResult("일정 생성", {
                        message: "제목, 시작 일시, 종료 일시를 입력해 주세요.",
                    });
                    return;
                }

                const startAt = new Date(startValue);
                const endAt = new Date(endValue);

                if (
                    Number.isNaN(startAt.getTime()) ||
                    Number.isNaN(endAt.getTime()) ||
                    endAt <= startAt
                ) {
                    showResult("일정 생성", {
                        message: "종료 일시는 시작 일시보다 늦어야 합니다.",
                    });
                    return;
                }

                const contents = {
                    title,
                    startAt,
                    endAt,
                    memo,
                    isPublic,
                    source: "manual",
                    ...(groupId ? { groupId } : {}),
                };
                await runTest("일정 생성", () =>
                    createEvent(
                        contents.title,
                        contents.startAt,
                        contents.endAt,
                        contents.memo,
                        contents.isPublic,
                        contents.source,
                        contents.groupId,
                    ),
                );
            });

            // 2. 내 일정 조회
            $("getUserEventsBtn").addEventListener("click", async () => {
                await runTest("내 일정 조회", () => getUserEvents());
            });

            // 3. 그룹 일정 조회
            $("getGroupEventsBtn").addEventListener("click", async () => {
                const groupId = $("searchGroupId").value.trim();

                if (!groupId) {
                    showResult("그룹 일정 조회", {
                        message: "그룹 ID를 입력해 주세요.",
                    });
                    return;
                }

                await runTest("그룹 일정 조회", () => getGroupEvents(groupId));
            });

            // 4. 일정 제목 검색
            $("findBtn").addEventListener("click", async () => {
                const keyword = $("findTitle").value.trim();

                if (!keyword) {
                    showResult("일정 검색", {
                        message: "검색어를 입력해 주세요.",
                    });
                    return;
                }

                await runTest("일정 제목 검색", () =>
                    findEventByTitle(keyword),
                );
            });

            // 5. 일정 수정
            $("updateBtn").addEventListener("click", async () => {
                const eventId = $("updateEventId").value.trim();
                const title = $("updateTitle").value.trim();
                const memo = $("updateMemo").value.trim();

                if (!eventId) {
                    showResult("일정 수정", {
                        message: "수정할 일정 ID를 입력해 주세요.",
                    });
                    return;
                }

                const contents = {};

                if (title) contents.title = title;
                if (memo) contents.memo = memo;

                if (Object.keys(contents).length === 0) {
                    showResult("일정 수정", {
                        message: "변경할 제목이나 메모를 입력해 주세요.",
                    });
                    return;
                }

                await runTest("일정 수정", () =>
                    updateEvent(eventId, contents),
                );
            });

            // 6. 일정 삭제
            $("deleteBtn").addEventListener("click", async () => {
                const eventId = $("deleteEventId").value.trim();

                if (!eventId) {
                    showResult("일정 삭제", {
                        message: "삭제할 일정 ID를 입력해 주세요.",
                    });
                    return;
                }

                if (!confirm(`일정 ${eventId}를 삭제할까요?`)) {
                    return;
                }

                await runTest("일정 삭제", () => deleteEvent(eventId));
            });

            // 7. ICS 파일 가져오기 기능 확인
            $("icsBtn").addEventListener("click", () => {
                const file = $("icsFile").files[0];

                if (!file) {
                    showResult("ICS 파일", {
                        message: "먼저 ICS 파일을 선택해 주세요.",
                    });
                    return;
                }

                if (!file.name.toLowerCase().endsWith(".ics")) {
                    showResult("ICS 파일", {
                        message: "확장자가 .ics인 파일을 선택해 주세요.",
                    });
                    return;
                }

                showResult("ICS 파일", {
                    fileName: file.name,
                    fileSize: file.size,
                    message:
                        "파일 선택은 완료되었습니다. " +
                        "실제 가져오기를 수행하려면 calendar.js에 " +
                        "ICS 가져오기 함수를 구현해야 합니다.",
                });
            });

            // 결과 지우기
            $("clearBtn").addEventListener("click", () => {
                result.textContent = "테스트 결과가 여기에 표시됩니다.";
            });
        </script>
    </body>
</html>
