<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./sign_up.css" />
    <title>로그인 화면</title>
  </head>
  <body>
    <div id="screen_box">
      <div id="signup_element">
        <div id="logo">
          <img
            src="../assets/logo.png"
            alt="로고 이미지"
            id="logo_img"
            width="100%"
            height="100%"
          />
        </div>
        <!--logo(로고 이미지)-->

        <h2 id="start_text">시작하기</h2>
        <p id="information_text">
          Weave에 로그인하고 <br />
          지인들과 함께 일정을 관리해보세요!
        </p>
        <!--start_text(안내 텍스트 모음)-->
        <div id="signup_input_box">
          <p>이름</p>
          <input type="text" placeholder="이름 입력하세요" />
        </div>
        <div id="signup_input_box">
          <p>이메일</p>
          <input type="text" placeholder="이메일을 입력하세요" />
        </div>
        <div id="signup_input_box">
          <p>비밀번호</p>
          <input type="text" placeholder="비밀번호를 입력하세요" />
        </div>
        <div id="signup_input_box">
          <p>비밀번호 확인</p>
          <input type="text" placeholder="비밀번호를 다시 입력하세요" />
        </div>

        <!--logup_upput (로그인 입력)-->

        <button id="signup_button">회원 가입</button>
        <!--로그인 버튼-->

        <div id="signup_text">
          회원이신가요? <a href="./sign_in.html">로그인</a>
        </div>
      </div>
      <!--login_element(로고+텍스트+로그인 페이지)-->
    </div>
    <!--screen_box)-->
  </body>
</html>
